[project]
name = "lunavi-science"
version = "1.0.0"
description = "LUNAVI science pipeline: geometric Sun and Earth visibility at lunar south-pole sites from NASA LOLA DEMs and NAIF SPICE."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "spiceypy>=6.0", "rasterio>=1.3", "pyproj>=3.6", "pillow>=10.0", "pyshp>=2.3", "truststore>=0.9"]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8.0", "httpx>=0.27", "skyfield>=1.48", "fastapi>=0.110"]

[project.scripts]
lunavi-science = "lunavi_science.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lunavi_science"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:skyfield.*"]
